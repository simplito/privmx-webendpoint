name: Tests

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  # Fast feedback on every push/PR: no WASM toolchain, no Docker. Runs in minutes.
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Lint (C++ formatting)
        run: npm run lint:clang-format

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Doc-quality check
        run: npm run lint:docs

      - name: Unit tests
        run: npm test

  # Slower: compiles the C++ -> WASM core, smoke-tests the example consumer path,
  # then runs the full e2e suite against a Docker backend.
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install CMake and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install dependencies
        run: npm ci

      - name: Build WASM + JS
        run: npm run build
        env:
          TERM: xterm

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # --- Example consumer smoke check (no Bridge needed) ---
      # Packs the SDK, installs it into example/vite exactly as a real consumer
      # would, and asserts the WASM core initialises in a real Vite + browser.
      - name: Pack SDK for the example
        run: npm pack
      - name: Install example dependencies
        run: cd example/vite && npm install
      - name: Example build/smoke test
        run: npm run test:example
        env:
          CI: true

      # --- Full e2e against the Bridge/Janus/Coturn/Mongo backend ---
      - name: Prepare e2e package
        run: npm run build-package && mkdir -p tests/pkg && tar -xzf builds/privmx-webendpoint-latest.tgz -C tests/pkg --strip-components=1

      - name: Start backend services
        run: |
          cd tests
          docker compose up -d
          sleep 15

      - name: Run e2e tests
        run: npx playwright test --config tests/playwright.config.ts --project=chromium --reporter=list
        env:
          CI: true
