name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Lint (C++ formatting)
        run: npm run lint:clang-format

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  build-and-e2e:
    name: Build WASM, smoke & e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install CMake and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cache C++ / WASM build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            emsdk
            dependency_sources
            webendpoint-cpp/build-emscripten
            drivers/*/build-emscripten
            async-engine/build-emscripten
          key: cpp-${{ runner.os }}-${{ hashFiles('build-manifest.sh', 'scripts/**', 'patches/**', 'webendpoint-cpp/**', 'drivers/**', 'async-engine/**') }}
          restore-keys: |
            cpp-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build WASM + JS
        run: npm run build
        env:
          TERM: xterm

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Pack SDK for the example
        run: npm pack
      - name: Install example dependencies
        run: cd example/vite && rm -f package-lock.json && npm install
      - name: Example build/smoke test
        run: npm run test:example
        env:
          CI: true

      - name: Prepare e2e package
        run: npm run build-package && mkdir -p tests/pkg && tar -xzf builds/privmx-webendpoint-latest.tgz -C tests/pkg --strip-components=1

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: builds/privmx-webendpoint-latest.tgz
          retention-days: 7
          if-no-files-found: error

      - name: Start backend services
        run: |
          cd tests
          docker compose up -d
          sleep 15

      - name: Run e2e tests
        run: npx playwright test --config tests/playwright.config.ts --project=chromium --reporter=list
        env:
          CI: true
