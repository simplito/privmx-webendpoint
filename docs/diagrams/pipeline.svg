<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 236" width="872" height="236" role="img" aria-label="Your app calls the typed TS API, which calls the WASM crypto core on worker threads. Only ciphertext leaves the browser for the PrivMX Bridge.">
  <style>
    .paper  { fill: #fbfbfb; }
    .node   { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1; }
    .focal  { fill: #f0f0f0; stroke: #333333; stroke-width: 1.6; }
    .ext    { fill: #f4f4f4; stroke: #b4b4b4; stroke-width: 1; }
    .zone   { fill: #f6f6f6; stroke: #cfcfcf; stroke-width: 1; stroke-dasharray: 4 4; }
    .name   { fill: #1f1f1f; font: 600 12px Arial, Helvetica, sans-serif; }
    .sub    { fill: #6b6b6b; font: 400 9px Consolas, "Liberation Mono", Menlo, monospace; }
    .eyebrow{ fill: #9a9a9a; font: 400 7px Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0.16em; }
    .arrow  { fill: none; stroke: #8a8a8a; stroke-width: 1.2; }
    .alabel { fill: #4a4a4a; font: 400 8px Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0.06em; }
    .head   { fill: #8a8a8a; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #161616; }
      .node  { fill: #202020; stroke: #6f6f6f; }
      .focal { fill: #2c2c2c; stroke: #d6d6d6; }
      .ext   { fill: #1c1c1c; stroke: #555555; }
      .zone  { fill: #1b1b1b; stroke: #4a4a4a; }
      .name  { fill: #ededed; }
      .sub   { fill: #a6a6a6; }
      .eyebrow { fill: #7d7d7d; }
      .arrow { stroke: #8f8f8f; }
      .alabel { fill: #bdbdbd; }
      .head  { fill: #8f8f8f; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>

  <rect class="paper" x="0" y="0" width="872" height="236" rx="8"/>

  <rect class="zone" x="16" y="56" width="584" height="128" rx="8"/>
  <rect class="paper" x="32" y="52" width="92" height="12" rx="2"/>
  <text class="eyebrow" x="36" y="61">THE BROWSER</text>

  <line class="arrow" x1="192" y1="120" x2="220" y2="120" marker-end="url(#a)"/>
  <line class="arrow" x1="384" y1="120" x2="412" y2="120" marker-end="url(#a)"/>
  <line class="arrow" x1="576" y1="120" x2="668" y2="120" marker-end="url(#a)"/>
  <rect class="paper" x="588" y="96" width="72" height="12" rx="2"/>
  <text class="alabel" x="624" y="105" text-anchor="middle">CIPHERTEXT</text>

  <rect class="node" x="32" y="88" width="160" height="64" rx="6"/>
  <text class="name" x="112" y="114" text-anchor="middle">Your app</text>
  <text class="sub"  x="112" y="132" text-anchor="middle">plaintext lives here</text>

  <rect class="node" x="224" y="88" width="160" height="64" rx="6"/>
  <text class="name" x="304" y="114" text-anchor="middle">Web Endpoint</text>
  <text class="sub"  x="304" y="132" text-anchor="middle">typed TS API</text>

  <rect class="focal" x="416" y="88" width="160" height="64" rx="6"/>
  <text class="name" x="496" y="110" text-anchor="middle">WASM core</text>
  <text class="sub"  x="496" y="126" text-anchor="middle">encrypt / decrypt</text>
  <text class="sub"  x="496" y="140" text-anchor="middle">on worker threads</text>

  <rect class="ext" x="668" y="88" width="172" height="64" rx="6"/>
  <text class="name" x="754" y="114" text-anchor="middle">PrivMX Bridge</text>
  <text class="sub"  x="754" y="132" text-anchor="middle">stores ciphertext</text>

  <text class="sub" x="32" y="172">Your key is made here and stays here.</text>
</svg>
