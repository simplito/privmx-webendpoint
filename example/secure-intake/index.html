<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PrivMX - secure intake (GroupApi only)</title>
        <style>
            :root {
                --line: #e4e4e7;
                --muted: #71717a;
                --bg: #fafafa;
                --ok: #16a34a;
                --warn: #b45309;
                --off: #a1a1aa;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, sans-serif;
                max-width: 1240px;
                margin: 1.5rem auto;
                padding: 0 1rem;
                line-height: 1.5;
                color: #18181b;
            }
            h1 {
                font-size: 1.35rem;
                margin: 0 0 0.25rem;
            }
            h2 {
                font-size: 1rem;
                margin: 0;
            }
            p.lede {
                color: var(--muted);
                font-size: 0.9rem;
                margin: 0 0 1rem;
            }
            button {
                padding: 0.45rem 0.8rem;
                cursor: pointer;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: #fff;
                font: inherit;
            }
            button:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            button.primary {
                background: #18181b;
                color: #fff;
                border-color: #18181b;
            }
            input,
            textarea {
                padding: 0.45rem;
                border: 1px solid var(--line);
                border-radius: 6px;
                font: inherit;
                min-width: 0;
                width: 100%;
            }

            #step {
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                border-radius: 8px;
                padding: 0.6rem 0.8rem;
                margin-bottom: 1rem;
                font-size: 0.9rem;
                display: flex;
                gap: 0.75rem;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .panes {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 1rem;
            }
            @media (max-width: 980px) {
                .panes {
                    grid-template-columns: 1fr;
                }
            }
            .pane {
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 0.8rem;
                background: #fff;
                display: flex;
                flex-direction: column;
                gap: 0.55rem;
            }
            .pane.anon {
                background: #fffbeb;
                border-color: #fde68a;
            }
            .pane header {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                justify-content: space-between;
            }
            .status {
                font-size: 0.8rem;
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 0.35rem;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--off);
                flex: none;
            }
            .dot.on {
                background: var(--ok);
            }
            .dot.warn {
                background: var(--warn);
            }
            .meta,
            .muted {
                font-size: 0.76rem;
                color: var(--muted);
            }
            .meta {
                font-family: ui-monospace, monospace;
            }

            .submissions {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                max-height: 11rem;
                overflow-y: auto;
            }
            .submission {
                text-align: left;
                font-size: 0.83rem;
                display: flex;
                gap: 0.4rem;
                align-items: center;
                border-color: transparent;
                background: var(--bg);
            }
            .submission.on {
                border-color: #18181b;
            }
            .badge {
                font-size: 0.66rem;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                border-radius: 999px;
                padding: 0.05rem 0.4rem;
                flex: none;
            }
            .badge.anon {
                background: #fef3c7;
                color: #92400e;
            }
            .badge.signed {
                background: #dcfce7;
                color: #166534;
            }
            .badge.err {
                background: #fee2e2;
                color: #991b1b;
            }
            .badge.wait {
                background: #f4f4f5;
                color: var(--muted);
            }
            .clip {
                margin-left: auto;
            }

            .detail {
                border-top: 1px dashed var(--line);
                padding-top: 0.5rem;
                font-size: 0.87rem;
            }
            .detail p {
                margin: 0.3rem 0;
            }
            .detail .err {
                color: #991b1b;
            }
            .file {
                background: var(--bg);
                border-radius: 8px;
                padding: 0.5rem;
                margin-top: 0.4rem;
                font-size: 0.8rem;
            }
            .file code {
                word-break: break-all;
            }
            .comment {
                border-left: 2px solid var(--line);
                padding-left: 0.5rem;
            }
            .row {
                display: flex;
                gap: 0.4rem;
                align-items: center;
                margin-top: 0.4rem;
            }
            .row input {
                flex: 1;
            }
            .row button {
                flex: none;
            }
            .hint {
                font-size: 0.78rem;
                color: var(--muted);
                min-height: 1.1rem;
            }
            .manager {
                border-top: 1px dashed var(--line);
                padding-top: 0.5rem;
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
            }
            .tag {
                font-size: 0.7rem;
                background: #f4f4f5;
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 0.05rem 0.45rem;
                color: var(--muted);
            }

            .inspector {
                margin-top: 1rem;
                border: 1px dashed var(--line);
                border-radius: 8px;
                padding: 0.6rem 0.8rem;
                font-size: 0.8rem;
            }
            .inspector table {
                width: 100%;
                border-collapse: collapse;
                margin: 0.5rem 0;
            }
            .inspector th,
            .inspector td {
                text-align: left;
                padding: 0.2rem 0.4rem;
                border-bottom: 1px solid var(--line);
                font-weight: 400;
            }
            .inspector th {
                color: var(--muted);
                font-size: 0.72rem;
                text-transform: uppercase;
            }
            .hex {
                font-family: ui-monospace, monospace;
                font-size: 0.7rem;
                color: var(--muted);
                word-break: break-all;
            }

            #log {
                margin-top: 0.5rem;
                background: #18181b;
                color: #e4e4e7;
                border-radius: 8px;
                padding: 0.7rem;
                white-space: pre-wrap;
                font-family: ui-monospace, monospace;
                font-size: 0.76rem;
                max-height: 14rem;
                overflow-y: auto;
            }
            details summary {
                cursor: pointer;
                font-size: 0.85rem;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
